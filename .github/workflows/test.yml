name: test macime & macimed

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Swift version
        run: swift --version

      - name: Run tests
        run: swift test

      - name: Build (release)
        run: swift build -c release

      - name: Run macime get (direct)
        run: |
          .build/release/macime get
